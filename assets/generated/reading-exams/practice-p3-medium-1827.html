<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 阅读练习</title>
    <link rel="stylesheet" href="../../../css/vocabulary-notebook.css">
    <link rel="stylesheet" href="../../../css/vocabulary-notebook-v2.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.__READING_ORIGINAL_UI__ = true;
        document.documentElement.removeAttribute('data-image-skin');
        document.documentElement.removeAttribute('data-theme');
    </script>
    <style>
        #image-skin-panel,
        #season-theme-panel,
        #skin-cursor-halo,
        #skin-cursor-dot,
        #skin-atmosphere-layer,
        #season-weather-canvas,
        #skin-atmosphere-canvas {
            display: none !important;
        }
        :root {
            --line: #d7dde5;
            --panel: #ffffff;
            --panel-alt: #edf2f9;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #2563eb;
            --success: #15803d;
            --danger: #b91c1c;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --practice-header-height: 67px;
            --practice-nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            padding-bottom: var(--practice-nav-height);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .header p {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #timer,
        .header-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 8px 12px;
            font-size: 0.92rem;
            color: var(--text);
        }

        .header-btn {
            cursor: pointer;
        }

        .shell {
            display: flex;
            height: calc(100vh - var(--practice-header-height) - var(--practice-nav-height));
            min-height: 0;
            width: 100%;
        }

        .pane {
            overflow: auto;
            background: var(--panel);
            padding: 22px;
        }

        #left {
            width: 50%;
            min-width: 320px;
        }

        #divider {
            flex: 0 0 8px;
            background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            cursor: ew-resize;
        }

        #right {
            flex: 1;
            min-width: 320px;
            background: var(--panel-alt);
            padding: 16px 20px;
        }

        #left p,
        #right p {
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .unified-group {
            margin-bottom: 18px;
        }

        .group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px 32px;
            margin-bottom: 24px;
        }

        .question-item,
        .match-question-item,
        .choice-item {
            margin-bottom: 12px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            min-height: 40px;
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            background: #eff6ff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .paragraph-dropzone.drag-over,
        .match-dropzone.drag-over {
            border-color: var(--accent);
            background: #dbeafe;
        }

        .paragraph-dropzone.dropzone-filled,
        .match-dropzone.dropzone-filled {
            border-style: solid;
        }

        .paragraph-label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .pool-items,
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .pool-items {
            min-height: 40px;
        }

        .pool-items.drag-over {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.08);
        }

        .dropped-items:empty::after {
            content: "拖到这里";
            font-size: 0.82rem;
            color: #7b8a98;
            letter-spacing: 0.02em;
        }

        .drag-item {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            padding: 6px 10px;
            cursor: grab;
            font-size: 0.9rem;
            user-select: none;
        }

        .drag-item.dragging {
            opacity: 0.55;
        }

        .drag-item--assigned {
            border-style: solid;
        }

        .drag-item[draggable="false"] {
            cursor: pointer;
            border-style: solid;
        }

        .practice-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
            z-index: 2000;
        }

        .practice-nav .title {
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .practice-nav .questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-item,
        .practice-nav .controls button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 6px 12px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
        }

        .q-item:hover,
        .practice-nav .controls button:hover {
            background: #f1f5f9;
        }

        .q-item.active {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        .q-item.answered {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .q-item.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: var(--success);
        }

        .q-item.incorrect {
            border-color: var(--danger);
            background: #fee2e2;
            color: var(--danger);
        }

        /* ---- 套题模式：一次展示全部小节题目（约 40 题）+ 跨篇跳转 ---- */
        .practice-nav .questions.question-nav--suite {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 16px;
            flex: 1 1 auto;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .q-passage {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-passage__label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.16);
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .q-passage__label--btn {
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .q-passage__label--btn:hover {
            background: rgba(37, 99, 235, 0.18);
            color: var(--accent);
        }

        .q-passage.is-current .q-passage__label {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent);
        }

        .q-passage__items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .question-nav--suite .q-item {
            padding: 3px 8px;
            font-size: 0.8rem;
            min-width: 30px;
            text-align: center;
        }

        .question-nav--suite .q-passage:not(.is-current) .q-item {
            opacity: 0.8;
        }

        .practice-nav .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ---- 导出 PDF：整页打印（文章 + 题目 + 作答 + 高亮 + 详情）---- */
        /* 套题合并打印：屏幕上不显示，仅打印时启用 */
        #suite-print-root {
            display: none;
        }

        .pdf-inline-note-comment {
            display: none;
        }

        body.suite-printing .pdf-inline-note-comment {
            display: inline;
            margin-left: 3px;
            color: #9a3412;
            font-size: 0.88em;
            font-weight: 700;
            font-style: italic;
        }

        @media print {
            html, body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 0 !important;
            }

            /* 套题导出：只打印三篇合并内容，隐藏只渲染单篇的实时页面 */
            body.suite-printing .shell,
            body.suite-printing .header,
            body.suite-printing #results,
            body.suite-printing #question-nav {
                display: none !important;
            }

            body.suite-printing #suite-print-root {
                display: block !important;
            }

            .pdf-inline-highlight {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-inline-note-comment {
                display: inline !important;
                margin-left: 3px;
                color: #9a3412 !important;
                font-size: 9pt;
                font-weight: 700;
                font-style: italic;
                white-space: normal;
            }

            #suite-print-root .suite-print__head h1 {
                font-size: 18pt;
                margin: 0 0 4px;
            }

            #suite-print-root .suite-print__head p {
                margin: 0 0 16px;
                font-weight: 700;
            }

            #suite-print-root .suite-print__passage {
                page-break-before: always;
                break-before: page;
            }

            #suite-print-root .suite-print__passage:first-of-type {
                page-break-before: auto;
                break-before: auto;
            }

            #suite-print-root .suite-print__title {
                font-size: 14pt;
                margin: 0 0 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #1f7a4d;
            }

            #suite-print-root .suite-print__tag {
                display: inline-block;
                margin-right: 8px;
                padding: 1px 8px;
                border-radius: 4px;
                background: #1f7a4d;
                color: #fff;
                font-size: 11pt;
            }

            #suite-print-root .suite-print__score {
                float: right;
                font-size: 12pt;
                color: #1f7a4d;
            }

            #suite-print-root .suite-print__article {
                margin-bottom: 14px;
                line-height: 1.7;
            }

            #suite-print-root .suite-print__answers {
                width: 100%;
                border-collapse: collapse;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #suite-print-root .suite-print__answers th,
            #suite-print-root .suite-print__answers td {
                border: 1px solid #cfd8dc;
                padding: 5px 8px;
                text-align: center;
                font-size: 10pt;
            }

            /* 完整题目区（与单篇导出一致：文章后接全部题目） */
            #suite-print-root .suite-print__questions {
                margin: 6px 0 16px;
                line-height: 1.6;
                font-size: 10.5pt;
            }

            #suite-print-root .suite-print__questions .unified-group,
            #suite-print-root .suite-print__questions .group {
                margin: 0 0 14px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__questions input[type="text"],
            #suite-print-root .suite-print__questions .blank {
                border: none;
                border-bottom: 1px solid #555;
                min-width: 90px;
                background: transparent;
            }

            #suite-print-root .suite-print__answerkey {
                margin-top: 12px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__ak-title {
                font-size: 12pt;
                margin: 0 0 6px;
                color: #1f7a4d;
            }

            /* 隐藏交互/悬浮元素（保留 header-controls 中的 timer 作为做题用时） */
            #settings-panel,
            #notes-panel,
            .overlay,
            #divider,
            #selbar,
            .practice-nav,
            .header-controls .header-btn {
                display: none !important;
            }

            /* 单篇导出 PDF：打印做题用时 */
            #timer::before {
                content: "做题用时：";
                font-weight: 700;
                color: #1f7a4d;
            }

            .header {
                position: static !important;
                box-shadow: none !important;
            }

            /* 双栏展开为整页单列，完整显示全部内容 */
            .shell {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            #left,
            #right {
                width: 100% !important;
                min-width: 0 !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
            }

            #right {
                margin-top: 18px;
            }

            /* 练习记录详情（结果区）始终展开 */
            #results {
                display: block !important;
            }

            .unified-group,
            .group,
            #results {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 保留高亮底色 */
            .hl {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .submit-btn {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            font-weight: 600;
        }

        #results {
            display: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin-top: 18px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: center;
        }

        .result-correct {
            color: var(--success);
            font-weight: 700;
        }

        .result-incorrect {
            color: var(--danger);
            font-weight: 700;
        }

        /* 套题结果：三篇分节呈现 */
        .suite-result-total {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 6px 0 4px;
        }

        .suite-result-band {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
            font-size: 0.86rem;
        }

        .suite-result-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .suite-result-section__head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suite-result-section__tag {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
        }

        .suite-result-section__title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.92rem;
            opacity: 0.85;
        }

        .suite-result-section__score {
            flex: 0 0 auto;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        /* 提交后展示的微信 / 二维码联系卡片 */
        .contact-card {
            margin-top: 20px;
            padding: 18px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            background: var(--panel-alt, #f8fafc);
        }

        .contact-card .contact-title {
            margin: 0 0 12px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-card .contact-qr {
            display: block;
            width: 200px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .contact-card .contact-wechat {
            margin: 6px 0 4px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .contact-card .wechat-id-copy {
            display: inline-block;
            padding: 4px 12px;
            margin-left: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: #07c160;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        .contact-card .wechat-id-copy:hover {
            background: #06ad56;
        }

        .contact-card .wechat-id-copy.copied {
            background: #0369d9;
        }

        .contact-card .contact-hint {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--muted, #94a3b8);
        }

        body.dark-mode .contact-card {
            background: var(--panel-alt, #0f172a);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            z-index: 800;
        }

        #settings-panel,
        #notes-panel,
        #selbar {
            display: none;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                padding-bottom: calc(var(--practice-nav-height) + 16px);
            }

            .shell {
                display: block;
                height: auto;
            }

            #left,
            #right {
                width: 100%;
                min-width: 0;
            }

            #divider {
                display: none;
            }

            .practice-nav {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .practice-nav .controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ---------------- Phase 2 Aesthetics ---------------- */
        #timer {
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        #timer:hover {
            opacity: 0.85;
        }

        #timer.paused {
            opacity: 0.5;
        }

        #settings-btn {
            font-size: 1.1rem;
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ---------------- IELTS Aesthetic Tweaks ---------------- */
        /* Flattening corners */
        .group,
        .unified-group,
        #results {
            border-radius: 4px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            border-radius: 4px;
        }

        .drag-item {
            border-radius: 4px;
        }

        #timer,
        .header-btn,
        .q-item,
        .practice-nav .controls button {
            border-radius: 4px;
        }

        /* Font size utility classes */
        html.font-normal {
            font-size: 16px;
        }

        html.font-large {
            font-size: 18px;
        }

        html.font-xlarge {
            font-size: 20px;
        }

        /* Highlight visual */
        .hl {
            background-color: #72361c;
            color: #fff;
        }

        /* Note highlight */
        .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
            cursor: pointer;
        }

        .hl[data-hl-type="note"].note-anchor-active {
            background-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.35);
        }

        /* Pink highlight (second highlight pass) */
        .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        /* 回顾只读模式：隐藏选区工具条的高亮/删除按钮（仅保留 Note 查看） */
        body.review-readonly-mode #btnHL,
        body.review-readonly-mode #btnUH {
            display: none;
        }

        /* 回顾只读模式：计时器不可点击 */
        body.review-readonly-mode #timer {
            cursor: default;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --panel: #1e293b;
            --panel-alt: #0f172a;
            --text: #f8fafc;
            --line: #334155;
            background: #020617;
        }

        body.dark-mode .header {
            background: rgba(30, 41, 59, 0.94);
            border-bottom: 1px solid var(--line);
        }

        body.dark-mode .group,
        body.dark-mode .unified-group {
            background: var(--panel);
        }

        body.dark-mode .hl {
            background-color: #72361c;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        body.dark-mode .paragraph-dropzone,
        body.dark-mode .match-dropzone {
            background: #1e293b;
            border-color: #475569;
        }

        body.dark-mode .drag-item {
            background: #334155;
            border-color: #64748b;
            color: #f8fafc;
        }

        body.dark-mode #timer,
        body.dark-mode .header-btn {
            background: var(--panel);
            color: #f8fafc;
        }

        /* Phase 3 Nav Dark Mode */
        body.dark-mode .practice-nav {
            background: var(--panel);
            border-color: var(--line);
        }

        body.dark-mode .q-item,
        body.dark-mode .practice-nav .controls button {
            background: var(--panel-alt);
            color: #f8fafc;
            border-color: var(--line);

        "kind": "html",
        "html": "<h2>READING PASSAGE</h2>\n<h3>The Rise of Big Data 大数据的崛起</h3>\n<p><strong>A</strong> Big Data marks one of the most remarkable intellectual and technological shifts of the modern era. It does not simply refer to an enormous quantity of information, but rather to a completely new way of thinking about knowledge itself. Unlike the Internet, which connects people and enables communication, Big Data connects data to other data. It transforms scattered fragments of digital information into meaningful patterns, predictions, and insights. Today, nearly every human activity leaves a digital trace: text messages, online purchases, GPS movements, photos, voice commands, and even biometric signals. All of these pieces of information are stored, analyzed, and often combined with other data sources to create a detailed and dynamic picture of the world. Through this process, aspects of life that were once invisible, such as emotions, preferences, or social relationships, have become \"datafied,\" meaning that they can now be measured and studied quantitatively.</p>\n<p><strong>B</strong> This transformation has profound implications for how we understand society. In the past, researchers relied on small samples, surveys, and questionnaires to draw conclusions about human behavior. These methods were slow, expensive, and often inaccurate. With Big Data, it is possible to analyze entire populations in real time. For example, Google can track the spread of influenza by monitoring search terms related to flu symptoms, providing results that are faster and sometimes more accurate than those collected by public health agencies. Similarly, credit card companies can detect fraud within seconds by comparing a transaction against millions of others to identify patterns that deviate from the norm. In the realm of urban planning, data from mobile phones and GPS devices can reveal how people move through cities, helping planners design more efficient transport systems.</p>\n<p><strong>C</strong> However, the rise of Big Data also raises significant ethical and philosophical questions. One of the most pressing concerns is privacy. In a world where every action is recorded and stored, the concept of personal privacy becomes increasingly difficult to maintain. Data that seems anonymous can often be re-identified when combined with other datasets. Researchers have demonstrated that it is possible to identify individuals from anonymized data using just a few data points, such as their age, gender, and zip code. This has led to fears of surveillance, manipulation, and discrimination. Companies and governments now possess more information about individuals than at any other time in history, and the potential for misuse is enormous.</p>\n<p><strong>D</strong> Another concern is the issue of bias. Big Data is often assumed to be objective because it is based on numbers rather than human judgment. However, the data itself is shaped by human choices: what to collect, how to categorize it, and which questions to ask. If these choices reflect existing prejudices, the resulting analysis will simply reproduce those prejudices at a larger scale. For example, predictive policing algorithms that analyze crime data may reinforce racial profiling if the original data reflects biased policing practices. Similarly, hiring algorithms trained on historical data may discriminate against women or minorities if past hiring decisions were biased. The idea that data speaks for itself is a myth; data always speaks through the lens of those who collect and interpret it.</p>\n<p><strong>E</strong> The rise of Big Data also challenges traditional notions of causality. For centuries, science has sought to understand the world by identifying cause-and-effect relationships. Big Data, by contrast, often focuses on correlation. It can tell us that two things are related, but not why. This shift from \"why\" to \"what\" has practical benefits. Businesses can use correlations to predict consumer behavior without understanding the underlying reasons. However, it also has limitations. Correlations can be spurious, leading to false conclusions. Without an understanding of causation, interventions based on correlations may fail or even backfire. The challenge for the future is to combine the power of Big Data with the rigor of traditional scientific methods.</p>\n<p><strong>F</strong> Despite these challenges, the potential benefits of Big Data are immense. In medicine, researchers are using data from electronic health records, genetic sequencing, and wearable devices to develop personalized treatments tailored to individual patients. In education, data from online learning platforms can help identify which teaching methods are most effective for different types of students. In environmental science, satellite data and sensor networks are improving our ability to monitor deforestation, track wildlife populations, and predict natural disasters. The list of applications grows longer every day.</p>\n<p><strong>G</strong> Ultimately, the rise of Big Data represents a fundamental shift in how we understand and interact with the world. It offers unprecedented opportunities to solve complex problems, but it also demands that we think carefully about the values we want to preserve. Privacy, fairness, transparency, and accountability are not technical issues; they are social and political ones. As Big Data becomes ever more pervasive, the decisions we make today about how to collect, analyze, and use data will shape the world for generations to come. The future will belong not just to those who can harness the power of data, but to those who can do so wisely and ethically.</p>"

      "bodyHtml": "<div class=\"group\" id=\"q27-28-29-30-31-anchor\"><h4>Questions 27-31</h4><p>Choose the correct letter, A, B, C or D.</p><a id=\"q27-anchor\"></a><div><p>27. What does the passage suggest is the main difference between the Internet and Big Data?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"A\"> A. The Internet is older and more established than Big Data.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"B\"> B. The Internet connects people, while Big Data connects data to other data.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"C\"> C. The Internet is used for communication, while Big Data is used for storage.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"D\"> D. The Internet is global, while Big Data is limited to specific applications.</label></div></div></div><a id=\"q28-anchor\"></a><div><p>28. According to the passage, what makes it possible to track the spread of influenza using Google?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"A\"> A. Surveys collected by public health agencies</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"B\"> B. Monitoring search terms related to flu symptoms</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"C\"> C. Analyzing GPS movements of infected individuals</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"D\"> D. Combining data from credit card transactions</label></div></div></div><a id=\"q29-anchor\"></a><div><p>29. What concern about privacy is raised in the passage?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"A\"> A. Data that seems anonymous can often be re-identified.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"B\"> B. Governments have stopped collecting personal information.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"C\"> C. Companies no longer store data about individuals.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"D\"> D. Privacy laws have made data analysis impossible.</label></div></div></div><a id=\"q30-anchor\"></a><div><p>30. Why does the passage argue that Big Data is not necessarily objective?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"A\"> A. Because numbers are always unreliable.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"B\"> B. Because human choices shape what data is collected and how it is interpreted.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"C\"> C. Because computers make frequent errors in analysis.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"D\"> D. Because statistical methods are inherently biased.</label></div></div></div><a id=\"q31-anchor\"></a><div><p>31. What limitation of focusing on correlation rather than causation is mentioned?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"A\"> A. Correlations are always accurate and reliable.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"B\"> B. Correlations can be spurious and lead to false conclusions.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"C\"> C. Correlations are too difficult for computers to calculate.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"D\"> D. Correlations require understanding of underlying reasons.</label></div></div></div></div>",

      "bodyHtml": "<div class=\"group\" id=\"q32-33-34-35-36-anchor\"><h4>Questions 32-36</h4><p>Complete the summary below.</p><p>Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.</p><p>Big Data has transformed how we understand society by allowing researchers to analyze entire <strong>32</strong> <input class=\"blank\" name=\"q32\" type=\"text\"> in real time, rather than relying on small samples. Credit card companies use Big Data to detect <strong>33</strong> <input class=\"blank\" name=\"q33\" type=\"text\"> within seconds by comparing transactions against millions of others. In urban planning, data from mobile phones and GPS devices helps planners design more efficient <strong>34</strong> <input class=\"blank\" name=\"q34\" type=\"text\"> systems. However, concerns about privacy arise because data that seems anonymous can often be <strong>35</strong> <input class=\"blank\" name=\"q35\" type=\"text\"> when combined with other datasets. Another issue is that algorithms trained on historical data may reproduce existing <strong>36</strong> <input class=\"blank\" name=\"q36\" type=\"text\">, such as racial profiling in policing or discrimination in hiring.</p></div>",

      "bodyHtml": "<div class=\"group\" id=\"q37-38-39-40-anchor\"><h4>Questions 37-40</h4><p>Do the following statements agree with the claims of the writer in Reading Passage 3?</p><div class=\"question-item\"><p><strong>37</strong> Predictive policing algorithms are always fair and unbiased.</p><div class=\"radio-options\"><label><input name=\"q37\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q37\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q37\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>38</strong> Understanding causation is less important than identifying correlations.</p><div class=\"radio-options\"><label><input name=\"q38\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q38\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q38\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>39</strong> In medicine, Big Data is helping to develop treatments tailored to individual patients.</p><div class=\"radio-options\"><label><input name=\"q39\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q39\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q39\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>40</strong> The decisions made today about data use will have long-term consequences for future generations.</p><div class=\"radio-options\"><label><input name=\"q40\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q40\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q40\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div></div>",
