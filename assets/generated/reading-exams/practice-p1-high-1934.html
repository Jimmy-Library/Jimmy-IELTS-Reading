<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 阅读练习</title>
    <link rel="stylesheet" href="../../../css/vocabulary-notebook.css">
    <link rel="stylesheet" href="../../../css/vocabulary-notebook-v2.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.__READING_ORIGINAL_UI__ = true;
        document.documentElement.removeAttribute('data-image-skin');
        document.documentElement.removeAttribute('data-theme');
    </script>
    <style>
        #image-skin-panel,
        #season-theme-panel,
        #skin-cursor-halo,
        #skin-cursor-dot,
        #skin-atmosphere-layer,
        #season-weather-canvas,
        #skin-atmosphere-canvas {
            display: none !important;
        }
        :root {
            --line: #d7dde5;
            --panel: #ffffff;
            --panel-alt: #edf2f9;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #2563eb;
            --success: #15803d;
            --danger: #b91c1c;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --practice-header-height: 67px;
            --practice-nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            padding-bottom: var(--practice-nav-height);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .header p {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #timer,
        .header-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 8px 12px;
            font-size: 0.92rem;
            color: var(--text);
        }

        .header-btn {
            cursor: pointer;
        }

        .shell {
            display: flex;
            height: calc(100vh - var(--practice-header-height) - var(--practice-nav-height));
            min-height: 0;
            width: 100%;
        }

        .pane {
            overflow: auto;
            background: var(--panel);
            padding: 22px;
        }

        #left {
            width: 50%;
            min-width: 320px;
        }

        #divider {
            flex: 0 0 8px;
            background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            cursor: ew-resize;
        }

        #right {
            flex: 1;
            min-width: 320px;
            background: var(--panel-alt);
            padding: 16px 20px;
        }

        #left p,
        #right p {
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .unified-group {
            margin-bottom: 18px;
        }

        .group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px 32px;
            margin-bottom: 24px;
        }

        .question-item,
        .match-question-item,
        .choice-item {
            margin-bottom: 12px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            min-height: 40px;
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            background: #eff6ff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .paragraph-dropzone.drag-over,
        .match-dropzone.drag-over {
            border-color: var(--accent);
            background: #dbeafe;
        }

        .paragraph-dropzone.dropzone-filled,
        .match-dropzone.dropzone-filled {
            border-style: solid;
        }

        .paragraph-label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .pool-items,
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .pool-items {
            min-height: 40px;
        }

        .pool-items.drag-over {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.08);
        }

        .dropped-items:empty::after {
            content: "拖到这里";
            font-size: 0.82rem;
            color: #7b8a98;
            letter-spacing: 0.02em;
        }

        .drag-item {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            padding: 6px 10px;
            cursor: grab;
            font-size: 0.9rem;
            user-select: none;
        }

        .drag-item.dragging {
            opacity: 0.55;
        }

        .drag-item--assigned {
            border-style: solid;
        }

        .drag-item[draggable="false"] {
            cursor: pointer;
            border-style: solid;
        }

        .practice-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
            z-index: 2000;
        }

        .practice-nav .title {
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .practice-nav .questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-item,
        .practice-nav .controls button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 6px 12px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
        }

        .q-item:hover,
        .practice-nav .controls button:hover {
            background: #f1f5f9;
        }

        .q-item.active {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        .q-item.answered {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .q-item.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: var(--success);
        }

        .q-item.incorrect {
            border-color: var(--danger);
            background: #fee2e2;
            color: var(--danger);
        }

        /* ---- 套题模式：一次展示全部小节题目（约 40 题）+ 跨篇跳转 ---- */
        .practice-nav .questions.question-nav--suite {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 16px;
            flex: 1 1 auto;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .q-passage {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-passage__label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.16);
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .q-passage__label--btn {
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .q-passage__label--btn:hover {
            background: rgba(37, 99, 235, 0.18);
            color: var(--accent);
        }

        .q-passage.is-current .q-passage__label {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent);
        }

        .q-passage__items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .question-nav--suite .q-item {
            padding: 3px 8px;
            font-size: 0.8rem;
            min-width: 30px;
            text-align: center;
        }

        .question-nav--suite .q-passage:not(.is-current) .q-item {
            opacity: 0.8;
        }

        .practice-nav .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ---- 导出 PDF：整页打印（文章 + 题目 + 作答 + 高亮 + 详情）---- */
        /* 套题合并打印：屏幕上不显示，仅打印时启用 */
        #suite-print-root {
            display: none;
        }

        .pdf-inline-note-comment {
            display: none;
        }

        body.suite-printing .pdf-inline-note-comment {
            display: inline;
            margin-left: 3px;
            color: #9a3412;
            font-size: 0.88em;
            font-weight: 700;
            font-style: italic;
        }

        @media print {
            html, body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 0 !important;
            }

            /* 套题导出：只打印三篇合并内容，隐藏只渲染单篇的实时页面 */
            body.suite-printing .shell,
            body.suite-printing .header,
            body.suite-printing #results,
            body.suite-printing #question-nav {
                display: none !important;
            }

            body.suite-printing #suite-print-root {
                display: block !important;
            }

            .pdf-inline-highlight {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-inline-note-comment {
                display: inline !important;
                margin-left: 3px;
                color: #9a3412 !important;
                font-size: 9pt;
                font-weight: 700;
                font-style: italic;
                white-space: normal;
            }

            #suite-print-root .suite-print__head h1 {
                font-size: 18pt;
                margin: 0 0 4px;
            }

            #suite-print-root .suite-print__head p {
                margin: 0 0 16px;
                font-weight: 700;
            }

            #suite-print-root .suite-print__passage {
                page-break-before: always;
                break-before: page;
            }

            #suite-print-root .suite-print__passage:first-of-type {
                page-break-before: auto;
                break-before: auto;
            }

            #suite-print-root .suite-print__title {
                font-size: 14pt;
                margin: 0 0 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #1f7a4d;
            }

            #suite-print-root .suite-print__tag {
                display: inline-block;
                margin-right: 8px;
                padding: 1px 8px;
                border-radius: 4px;
                background: #1f7a4d;
                color: #fff;
                font-size: 11pt;
            }

            #suite-print-root .suite-print__score {
                float: right;
                font-size: 12pt;
                color: #1f7a4d;
            }

            #suite-print-root .suite-print__article {
                margin-bottom: 14px;
                line-height: 1.7;
            }

            #suite-print-root .suite-print__answers {
                width: 100%;
                border-collapse: collapse;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #suite-print-root .suite-print__answers th,
            #suite-print-root .suite-print__answers td {
                border: 1px solid #cfd8dc;
                padding: 5px 8px;
                text-align: center;
                font-size: 10pt;
            }

            /* 完整题目区（与单篇导出一致：文章后接全部题目） */
            #suite-print-root .suite-print__questions {
                margin: 6px 0 16px;
                line-height: 1.6;
                font-size: 10.5pt;
            }

            #suite-print-root .suite-print__questions .unified-group,
            #suite-print-root .suite-print__questions .group {
                margin: 0 0 14px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__questions input[type="text"],
            #suite-print-root .suite-print__questions .blank {
                border: none;
                border-bottom: 1px solid #555;
                min-width: 90px;
                background: transparent;
            }

            #suite-print-root .suite-print__answerkey {
                margin-top: 12px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__ak-title {
                font-size: 12pt;
                margin: 0 0 6px;
                color: #1f7a4d;
            }

            /* 隐藏交互/悬浮元素（保留 header-controls 中的 timer 作为做题用时） */
            #settings-panel,
            #notes-panel,
            .overlay,
            #divider,
            #selbar,
            .practice-nav,
            .header-controls .header-btn {
                display: none !important;
            }

            /* 单篇导出 PDF：打印做题用时 */
            #timer::before {
                content: "做题用时：";
                font-weight: 700;
                color: #1f7a4d;
            }

            .header {
                position: static !important;
                box-shadow: none !important;
            }

            /* 双栏展开为整页单列，完整显示全部内容 */
            .shell {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            #left,
            #right {
                width: 100% !important;
                min-width: 0 !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
            }

            #right {
                margin-top: 18px;
            }

            /* 练习记录详情（结果区）始终展开 */
            #results {
                display: block !important;
            }

            .unified-group,
            .group,
            #results {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 保留高亮底色 */
            .hl {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .submit-btn {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            font-weight: 600;
        }

        #results {
            display: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin-top: 18px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: center;
        }

        .result-correct {
            color: var(--success);
            font-weight: 700;
        }

        .result-incorrect {
            color: var(--danger);
            font-weight: 700;
        }

        /* 套题结果：三篇分节呈现 */
        .suite-result-total {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 6px 0 4px;
        }

        .suite-result-band {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
            font-size: 0.86rem;
        }

        .suite-result-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .suite-result-section__head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suite-result-section__tag {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
        }

        .suite-result-section__title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.92rem;
            opacity: 0.85;
        }

        .suite-result-section__score {
            flex: 0 0 auto;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        /* 提交后展示的微信 / 二维码联系卡片 */
        .contact-card {
            margin-top: 20px;
            padding: 18px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            background: var(--panel-alt, #f8fafc);
        }

        .contact-card .contact-title {
            margin: 0 0 12px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-card .contact-qr {
            display: block;
            width: 200px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .contact-card .contact-wechat {
            margin: 6px 0 4px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .contact-card .wechat-id-copy {
            display: inline-block;
            padding: 4px 12px;
            margin-left: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: #07c160;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        .contact-card .wechat-id-copy:hover {
            background: #06ad56;
        }

        .contact-card .wechat-id-copy.copied {
            background: #0369d9;
        }

        .contact-card .contact-hint {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--muted, #94a3b8);
        }

        body.dark-mode .contact-card {
            background: var(--panel-alt, #0f172a);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            z-index: 800;
        }

        #settings-panel,
        #notes-panel,
        #selbar {
            display: none;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                padding-bottom: calc(var(--practice-nav-height) + 16px);
            }

            .shell {
                display: block;
                height: auto;
            }

            #left,
            #right {
                width: 100%;
                min-width: 0;
            }

            #divider {
                display: none;
            }

            .practice-nav {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .practice-nav .controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ---------------- Phase 2 Aesthetics ---------------- */
        #timer {
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        #timer:hover {
            opacity: 0.85;
        }

        #timer.paused {
            opacity: 0.5;
        }

        #settings-btn {
            font-size: 1.1rem;
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ---------------- IELTS Aesthetic Tweaks ---------------- */
        /* Flattening corners */
        .group,
        .unified-group,
        #results {
            border-radius: 4px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            border-radius: 4px;
        }

        .drag-item {
            border-radius: 4px;
        }

        #timer,
        .header-btn,
        .q-item,
        .practice-nav .controls button {
            border-radius: 4px;
        }

        /* Font size utility classes */
        html.font-normal {
            font-size: 16px;
        }

        html.font-large {
            font-size: 18px;
        }

        html.font-xlarge {
            font-size: 20px;
        }

        /* Highlight visual */
        .hl {
            background-color: #72361c;
            color: #fff;
        }

        /* Note highlight */
        .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
            cursor: pointer;
        }

        .hl[data-hl-type="note"].note-anchor-active {
            background-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.35);
        }

        /* Pink highlight (second highlight pass) */
        .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        /* 回顾只读模式：隐藏选区工具条的高亮/删除按钮（仅保留 Note 查看） */
        body.review-readonly-mode #btnHL,
        body.review-readonly-mode #btnUH {
            display: none;
        }

        /* 回顾只读模式：计时器不可点击 */
        body.review-readonly-mode #timer {
            cursor: default;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --panel: #1e293b;
            --panel-alt: #0f172a;
            --text: #f8fafc;
            --line: #334155;
            background: #020617;
        }

        body.dark-mode .header {
            background: rgba(30, 41, 59, 0.94);
            border-bottom: 1px solid var(--line);
        }

        body.dark-mode .group,
        body.dark-mode .unified-group {
            background: var(--panel);
        }

        body.dark-mode .hl {
            background-color: #72361c;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        body.dark-mode .paragraph-dropzone,
        body.dark-mode .match-dropzone {
            background: #1e293b;
            border-color: #475569;
        }

        body.dark-mode .drag-item {
            background: #334155;
            border-color: #64748b;
            color: #f8fafc;
        }

        body.dark-mode #timer,
        body.dark-mode .header-btn {
            background: var(--panel);
            color: #f8fafc;
        }

        /* Phase 3 Nav Dark Mode */
        body.dark-mode .practice-nav {
            background: var(--panel);
            border-color: var(--line);
        }

        body.dark-mode .q-item,
        body.dark-mode .practice-nav .controls button {
            background: var(--panel-alt);
            color: #f8fafc;
            border-color: var(--line);

      {
        "blockId": "passage-main",
        "kind": "html",
        "html": "<h2>READING PASSAGE</h2>\n<h3>The Can – A Brief History Lesson 罐头简史</h3>\n<p><strong>A</strong> The story of the can begins in 1795 when Nicholas Appert, a Parisian, had an idea: why not pack food in bottles like wine? Fifteen years later, after researching and testing his idea, he published his theory: if food is sufficiently heated and sealed in an airtight container, it will not spoil. In 1810 Peter Durand, an Englishman, wanted to surpass Appert’s invention, so he elected to try tin instead of glass. Like glass, tin could be sealed airtight but tin was not breakable and was much easier to handle. Durand himself did no canning, but two other Englishmen, Bryan Donkin and John Hall, used Durand’s patent. After experimenting for more than a year, they set up a commercial canning factory and by 1813 they were sending tins of food to British army and navy authorities for trial.</p>\n<div class=\"paragraph-wrapper\" id=\"q1-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"B\" data-question=\"q1\">\n        <span class=\"paragraph-label\">Paragraph B (Q1):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>B</strong> Perhaps the greatest encouragement to the newborn canning industry was the explosion in the number of new colonial territories. As people and goods were being transported to all parts of the world, the can industry itself was growing in new territories. Englishmen who emigrated to America brought their newfound knowledge with them. One of these was Thomas Kensett, who might fairly be called the father of the can manufacturing industry in the United States. In 1812 he set up a small plant on the New York waterfront to can the first hermetically sealed products in the United States.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q2-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"C\" data-question=\"q2\">\n        <span class=\"paragraph-label\">Paragraph C (Q2):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>C</strong> Just before the Civil War, a technical advance by canners enabled them to speed up production. Adding calcium chloride to the water in which cans were cooked raised the water temperature, speeding up the canning process. Also for almost 100 years, tin cans were made by artisans by hand. It was a laborious process, requiring considerable skill and muscle. As the industrial revolution took hold in the United States, the demand for cans increased and machines began to replace the artisans’ handiwork. A good artisan could make only 10 cans a day. True production progress in can-making began in 1922, when American engineers perfected the body-making process. New methods soon increased production of cans to as many as 250 a minute.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q3-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"D\" data-question=\"q3\">\n        <span class=\"paragraph-label\">Paragraph D (Q3):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>D</strong> As early as 1940, can manufacturers began to explore the possibility of adapting cans to package carbonated soft drinks. The can had to be strengthened to accommodate higher internal can pressures created by carbonation (especially during warm summer months), which meant increasing the thickness of the metal used in the can ends. Another concern for the new beverage can was its shelf life. Even small amounts of dissolved tin or iron from the can could impair the drinking quality of drinks. Also the food acids, including carbonic, citric and phosphoric, in soft drinks presented a risk for the rapid corrosion of exposed tin and iron in the can. At this point the can was upgraded by improving the organic coatings used to line the inside. The can manufacturers then embarked on a program of material and cost savings by reducing both the amount of steel and the amount of coating used in can making. These efforts were in part inspired by a new competitor - aluminum.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q4-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"E\" data-question=\"q4\">\n        <span class=\"paragraph-label\">Paragraph E (Q4):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>E</strong> Beverage cans made from aluminum were first introduced in 1965. This was an exciting innovation for the packaging industry because the aluminum can was made with only two pieces - a body and an end. This made production easier. Some of the reasons for the aluminum can’s acceptance were its ductility, its support of carbonation pressure, its lighter weight and the fact that aluminum does not rust. Both steel and aluminum cans used an easy-open end tab but the aluminum tab was much easier to make. Perhaps the most critical element in the aluminum can’s market success was its recycling value. Aluminum can recycling excelled economically in the competition with steel because of the efficiencies aluminum cans realized in making new cans from recycled materials compared with 100 percent virgin aluminum. Steel did not realize similar economies in the recycling process.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q5-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"F\" data-question=\"q5\">\n        <span class=\"paragraph-label\">Paragraph F (Q5):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>F</strong> Prior to 1970, can makers, customers and consumers alike were unaware of the impact that the mining and manufacturing of steel or aluminum had on the environment. The concept of natural resource preservation was not an issue of great importance and the low growth of population during these early years further de-emphasized concerns for resource depletion. Both industries, however, came to realize the importance of reducing their impact on the environment in the late 1960s and early 1970s as a new environmentally conscious generation emerged. Manufacturers began to recognize the economics of recycling, namely lower manufacturing costs from using less material and less energy. By the 1980s and 1990s, recycling had become a way of life. Aluminum can recycling has become a billion-dollar business and one of the world’s most successful environmental enterprises. Over the years, the aluminum can has come to be known as America’s most recyclable package, with over 60 percent of cans being recycled annually.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q6-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"G\" data-question=\"q6\">\n        <span class=\"paragraph-label\">Paragraph G (Q6):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>G</strong> Advances in can manufacturing technology have also brought us lighter aluminum cans. In 1972, one pound of aluminum yielded only 21.75 cans. Today, by using less material to make each can, one pound of aluminum makes approximately 32 cans - a 47 percent improvement. Just the lightening of can ends makes a huge difference. When you multiply the savings by the 100 billion cans that are made each year, the weight and savings are phenomenal - over 200 million pounds of aluminum!</p>\n</div>"
      }
    ]
