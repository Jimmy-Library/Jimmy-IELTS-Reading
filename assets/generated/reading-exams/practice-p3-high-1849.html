<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 阅读练习</title>
    <link rel="stylesheet" href="../../../css/vocabulary-notebook.css">
    <link rel="stylesheet" href="../../../css/vocabulary-notebook-v2.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.__READING_ORIGINAL_UI__ = true;
        document.documentElement.removeAttribute('data-image-skin');
        document.documentElement.removeAttribute('data-theme');
    </script>
    <style>
        #image-skin-panel,
        #season-theme-panel,
        #skin-cursor-halo,
        #skin-cursor-dot,
        #skin-atmosphere-layer,
        #season-weather-canvas,
        #skin-atmosphere-canvas {
            display: none !important;
        }
        :root {
            --line: #d7dde5;
            --panel: #ffffff;
            --panel-alt: #edf2f9;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #2563eb;
            --success: #15803d;
            --danger: #b91c1c;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --practice-header-height: 67px;
            --practice-nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            padding-bottom: var(--practice-nav-height);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .header p {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #timer,
        .header-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 8px 12px;
            font-size: 0.92rem;
            color: var(--text);
        }

        .header-btn {
            cursor: pointer;
        }

        .shell {
            display: flex;
            height: calc(100vh - var(--practice-header-height) - var(--practice-nav-height));
            min-height: 0;
            width: 100%;
        }

        .pane {
            overflow: auto;
            background: var(--panel);
            padding: 22px;
        }

        #left {
            width: 50%;
            min-width: 320px;
        }

        #divider {
            flex: 0 0 8px;
            background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            cursor: ew-resize;
        }

        #right {
            flex: 1;
            min-width: 320px;
            background: var(--panel-alt);
            padding: 16px 20px;
        }

        #left p,
        #right p {
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .unified-group {
            margin-bottom: 18px;
        }

        .group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px 32px;
            margin-bottom: 24px;
        }

        .question-item,
        .match-question-item,
        .choice-item {
            margin-bottom: 12px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            min-height: 40px;
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            background: #eff6ff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .paragraph-dropzone.drag-over,
        .match-dropzone.drag-over {
            border-color: var(--accent);
            background: #dbeafe;
        }

        .paragraph-dropzone.dropzone-filled,
        .match-dropzone.dropzone-filled {
            border-style: solid;
        }

        .paragraph-label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .pool-items,
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .pool-items {
            min-height: 40px;
        }

        .pool-items.drag-over {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.08);
        }

        .dropped-items:empty::after {
            content: "拖到这里";
            font-size: 0.82rem;
            color: #7b8a98;
            letter-spacing: 0.02em;
        }

        .drag-item {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            padding: 6px 10px;
            cursor: grab;
            font-size: 0.9rem;
            user-select: none;
        }

        .drag-item.dragging {
            opacity: 0.55;
        }

        .drag-item--assigned {
            border-style: solid;
        }

        .drag-item[draggable="false"] {
            cursor: pointer;
            border-style: solid;
        }

        .practice-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
            z-index: 2000;
        }

        .practice-nav .title {
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .practice-nav .questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-item,
        .practice-nav .controls button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 6px 12px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
        }

        .q-item:hover,
        .practice-nav .controls button:hover {
            background: #f1f5f9;
        }

        .q-item.active {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        .q-item.answered {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .q-item.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: var(--success);
        }

        .q-item.incorrect {
            border-color: var(--danger);
            background: #fee2e2;
            color: var(--danger);
        }

        /* ---- 套题模式：一次展示全部小节题目（约 40 题）+ 跨篇跳转 ---- */
        .practice-nav .questions.question-nav--suite {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 16px;
            flex: 1 1 auto;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .q-passage {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-passage__label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.16);
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .q-passage__label--btn {
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .q-passage__label--btn:hover {
            background: rgba(37, 99, 235, 0.18);
            color: var(--accent);
        }

        .q-passage.is-current .q-passage__label {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent);
        }

        .q-passage__items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .question-nav--suite .q-item {
            padding: 3px 8px;
            font-size: 0.8rem;
            min-width: 30px;
            text-align: center;
        }

        .question-nav--suite .q-passage:not(.is-current) .q-item {
            opacity: 0.8;
        }

        .practice-nav .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ---- 导出 PDF：整页打印（文章 + 题目 + 作答 + 高亮 + 详情）---- */
        /* 套题合并打印：屏幕上不显示，仅打印时启用 */
        #suite-print-root {
            display: none;
        }

        .pdf-inline-note-comment {
            display: none;
        }

        body.suite-printing .pdf-inline-note-comment {
            display: inline;
            margin-left: 3px;
            color: #9a3412;
            font-size: 0.88em;
            font-weight: 700;
            font-style: italic;
        }

        @media print {
            html, body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 0 !important;
            }

            /* 套题导出：只打印三篇合并内容，隐藏只渲染单篇的实时页面 */
            body.suite-printing .shell,
            body.suite-printing .header,
            body.suite-printing #results,
            body.suite-printing #question-nav {
                display: none !important;
            }

            body.suite-printing #suite-print-root {
                display: block !important;
            }

            .pdf-inline-highlight {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-inline-note-comment {
                display: inline !important;
                margin-left: 3px;
                color: #9a3412 !important;
                font-size: 9pt;
                font-weight: 700;
                font-style: italic;
                white-space: normal;
            }

            #suite-print-root .suite-print__head h1 {
                font-size: 18pt;
                margin: 0 0 4px;
            }

            #suite-print-root .suite-print__head p {
                margin: 0 0 16px;
                font-weight: 700;
            }

            #suite-print-root .suite-print__passage {
                page-break-before: always;
                break-before: page;
            }

            #suite-print-root .suite-print__passage:first-of-type {
                page-break-before: auto;
                break-before: auto;
            }

            #suite-print-root .suite-print__title {
                font-size: 14pt;
                margin: 0 0 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #1f7a4d;
            }

            #suite-print-root .suite-print__tag {
                display: inline-block;
                margin-right: 8px;
                padding: 1px 8px;
                border-radius: 4px;
                background: #1f7a4d;
                color: #fff;
                font-size: 11pt;
            }

            #suite-print-root .suite-print__score {
                float: right;
                font-size: 12pt;
                color: #1f7a4d;
            }

            #suite-print-root .suite-print__article {
                margin-bottom: 14px;
                line-height: 1.7;
            }

            #suite-print-root .suite-print__answers {
                width: 100%;
                border-collapse: collapse;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #suite-print-root .suite-print__answers th,
            #suite-print-root .suite-print__answers td {
                border: 1px solid #cfd8dc;
                padding: 5px 8px;
                text-align: center;
                font-size: 10pt;
            }

            /* 完整题目区（与单篇导出一致：文章后接全部题目） */
            #suite-print-root .suite-print__questions {
                margin: 6px 0 16px;
                line-height: 1.6;
                font-size: 10.5pt;
            }

            #suite-print-root .suite-print__questions .unified-group,
            #suite-print-root .suite-print__questions .group {
                margin: 0 0 14px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__questions input[type="text"],
            #suite-print-root .suite-print__questions .blank {
                border: none;
                border-bottom: 1px solid #555;
                min-width: 90px;
                background: transparent;
            }

            #suite-print-root .suite-print__answerkey {
                margin-top: 12px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__ak-title {
                font-size: 12pt;
                margin: 0 0 6px;
                color: #1f7a4d;
            }

            /* 隐藏交互/悬浮元素（保留 header-controls 中的 timer 作为做题用时） */
            #settings-panel,
            #notes-panel,
            .overlay,
            #divider,
            #selbar,
            .practice-nav,
            .header-controls .header-btn {
                display: none !important;
            }

            /* 单篇导出 PDF：打印做题用时 */
            #timer::before {
                content: "做题用时：";
                font-weight: 700;
                color: #1f7a4d;
            }

            .header {
                position: static !important;
                box-shadow: none !important;
            }

            /* 双栏展开为整页单列，完整显示全部内容 */
            .shell {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            #left,
            #right {
                width: 100% !important;
                min-width: 0 !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
            }

            #right {
                margin-top: 18px;
            }

            /* 练习记录详情（结果区）始终展开 */
            #results {
                display: block !important;
            }

            .unified-group,
            .group,
            #results {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 保留高亮底色 */
            .hl {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .submit-btn {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            font-weight: 600;
        }

        #results {
            display: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin-top: 18px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: center;
        }

        .result-correct {
            color: var(--success);
            font-weight: 700;
        }

        .result-incorrect {
            color: var(--danger);
            font-weight: 700;
        }

        /* 套题结果：三篇分节呈现 */
        .suite-result-total {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 6px 0 4px;
        }

        .suite-result-band {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
            font-size: 0.86rem;
        }

        .suite-result-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .suite-result-section__head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suite-result-section__tag {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
        }

        .suite-result-section__title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.92rem;
            opacity: 0.85;
        }

        .suite-result-section__score {
            flex: 0 0 auto;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        /* 提交后展示的微信 / 二维码联系卡片 */
        .contact-card {
            margin-top: 20px;
            padding: 18px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            background: var(--panel-alt, #f8fafc);
        }

        .contact-card .contact-title {
            margin: 0 0 12px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-card .contact-qr {
            display: block;
            width: 200px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .contact-card .contact-wechat {
            margin: 6px 0 4px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .contact-card .wechat-id-copy {
            display: inline-block;
            padding: 4px 12px;
            margin-left: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: #07c160;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        .contact-card .wechat-id-copy:hover {
            background: #06ad56;
        }

        .contact-card .wechat-id-copy.copied {
            background: #0369d9;
        }

        .contact-card .contact-hint {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--muted, #94a3b8);
        }

        body.dark-mode .contact-card {
            background: var(--panel-alt, #0f172a);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            z-index: 800;
        }

        #settings-panel,
        #notes-panel,
        #selbar {
            display: none;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                padding-bottom: calc(var(--practice-nav-height) + 16px);
            }

            .shell {
                display: block;
                height: auto;
            }

            #left,
            #right {
                width: 100%;
                min-width: 0;
            }

            #divider {
                display: none;
            }

            .practice-nav {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .practice-nav .controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ---------------- Phase 2 Aesthetics ---------------- */
        #timer {
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        #timer:hover {
            opacity: 0.85;
        }

        #timer.paused {
            opacity: 0.5;
        }

        #settings-btn {
            font-size: 1.1rem;
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ---------------- IELTS Aesthetic Tweaks ---------------- */
        /* Flattening corners */
        .group,
        .unified-group,
        #results {
            border-radius: 4px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            border-radius: 4px;
        }

        .drag-item {
            border-radius: 4px;
        }

        #timer,
        .header-btn,
        .q-item,
        .practice-nav .controls button {
            border-radius: 4px;
        }

        /* Font size utility classes */
        html.font-normal {
            font-size: 16px;
        }

        html.font-large {
            font-size: 18px;
        }

        html.font-xlarge {
            font-size: 20px;
        }

        /* Highlight visual */
        .hl {
            background-color: #72361c;
            color: #fff;
        }

        /* Note highlight */
        .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
            cursor: pointer;
        }

        .hl[data-hl-type="note"].note-anchor-active {
            background-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.35);
        }

        /* Pink highlight (second highlight pass) */
        .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        /* 回顾只读模式：隐藏选区工具条的高亮/删除按钮（仅保留 Note 查看） */
        body.review-readonly-mode #btnHL,
        body.review-readonly-mode #btnUH {
            display: none;
        }

        /* 回顾只读模式：计时器不可点击 */
        body.review-readonly-mode #timer {
            cursor: default;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --panel: #1e293b;
            --panel-alt: #0f172a;
            --text: #f8fafc;
            --line: #334155;
            background: #020617;
        }

        body.dark-mode .header {
            background: rgba(30, 41, 59, 0.94);
            border-bottom: 1px solid var(--line);
        }

        body.dark-mode .group,
        body.dark-mode .unified-group {
            background: var(--panel);
        }

        body.dark-mode .hl {
            background-color: #72361c;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        body.dark-mode .paragraph-dropzone,
        body.dark-mode .match-dropzone {
            background: #1e293b;
            border-color: #475569;
        }

        body.dark-mode .drag-item {
            background: #334155;
            border-color: #64748b;
            color: #f8fafc;
        }

        body.dark-mode #timer,
        body.dark-mode .header-btn {
            background: var(--panel);
            color: #f8fafc;
        }

        /* Phase 3 Nav Dark Mode */
        body.dark-mode .practice-nav {
            background: var(--panel);
            border-color: var(--line);
        }

        body.dark-mode .q-item,
        body.dark-mode .practice-nav .controls button {
            background: var(--panel-alt);
            color: #f8fafc;
            border-color: var(--line);

        "blockId": "passage-main",
        "kind": "html",
        "html": "<h2>READING PASSAGE</h2>\n<h3>The tuatara—past and future 大蜥蜴——过去与未来</h3>\n<p><strong>A</strong> The New Zealand species of lizard, the tuatara, is firmly embedded in the national psyche: an icon for today which dates from the age of dinosaurs; an ancient reptile commemorated on the back of the five cent coin. New Zealanders feel an affinity with the tuatara, and accept that active conservation management is required to ensure it will be among the legacies left to future generations.</p>\n<p><strong>B</strong> When European explorers reached New Zealand in 1769 they found two large islands, which together they called the 'mainland', and many tiny offshore islands around the coast. The naturalists who came with the explorers disregarded the tuatara, though it is improbable none were seen. Only several decades later did a tuatara specimen reach the British Museum, where it was eventually classified as just another type of lizard. One of the first scientists who realized that aspects of tuatara anatomy were odd—unchanged for tens of thousands of years—was Albert Gunther in 1876. Gunther believed the tuatara was one of the most valuable objects in zoological anatomical collections, and also noted, in passing, the reptile was likely to become extinct. From today's perspective, it is striking that Gunther expressed no concern about the probable demise of the tuatara. He and his contemporaries were products of their age, strongly influenced by Charles Darwin's theory, which had only recently been published. Their views were something like this: Extinction is a natural process. It is sad that species disappear, but that is part of nature.</p>\n<p><strong>C</strong> There is a second important aspect of Gunther's work. He recorded, correctly, that some of the mammals introduced by Europeans were predators of the tuatara—particularly rats. But what he did not realise was that New Zealand has two species of rat, both introduced, both with an appetite for tuatara: the ship's rat came with European explorers and settlers, but the kiore rat had already been in the country for hundreds of years, brought by Polynesians from the Pacific Islands. Gunther failed to recognise the distinction, believing all rats to be a relatively recent introduction.</p>\n<p><strong>D</strong> Little further research was conducted until Ian Crook of the NZ Wildlife Service published his findings in 1973, which can be summarised as follows. Tuatara thrive on offshore islands with no rats. Tuatara never survived on islands with ship's rats. On a few islands, small and declining populations of tuatara occur with the kiore. This should not be seen, however, as evidence that tuatara and kiore can coexist. Rather, Crook proposed, kiore probably only arrived recently on such islands, and thus the small populations represent extinctions in progress.</p>\n<p><strong>E</strong> Throughout the 1990s, Richard Holdaway and his colleagues at Victoria University in Wellington documented the surprising discovery that kiore probably arrived about 1800 years ago, although the human population of New Zealand is thought to be no older than 800 years. How is this possible? Presumably, Holdaway argued, the kiore were brought by Polynesian explorers who visited the country but did not settle. Thereafter, the rats were agents of ecological warfare, exterminating perhaps 1000-3000 species. Thus, tuatara and many other species were already rare or extinct when permanent human inhabitants—the Maori—arrived around 1300. This hypothesis is still being debated, but the evidence continues to accumulate in its favour.</p>\n<p><strong>F</strong> Conservation practice has changed dramatically since Crook's findings were published in 1973. Eradication of rats from any given environment was believed to be virtually impossible until about 1980, but since then has become routine. Enormous conservation benefits are accruing as newly rat-free offshore islands are providing sanctuaries for the country's rarest species. In 1995, for example, Nicola Nelson of the Department of Conservation established 68 tuatara on Ti Island. Since then, four more populations of tuatara have been established elsewhere under similar conditions. Today, numbers of tuatara are still a fraction of what they once were, but for the first time in 1800 years the decline has been reversed.</p>\n<p><strong>G</strong> While the recovery of rare species is itself a good thing, the truly significant outcome of this research is that it liberates the imagination. If we can remove predatory introduced mammals from islands, why not from the mainland too? Perhaps the questions we ask should demonstrate even more visionary ambition. Can non-mammalian pests also be removed from the mainland? Our rivers, for example, are full of surrogate rats, in the form of introduced species of fish called trout. Some day more people will understand that trout have replaced a whole native fauna in our waterways, just as rats replaced tuatara on the mainland. Will such knowledge lead to the creation of mainland aquatic islands where we can once again establish those species of indigenous fish that used to live in our rivers? Similarly, can bellbirds and tuis replace birds like starlings and mynahs?</p>\n<p><strong>H</strong> The answers to such questions are uncertain, and opposing sides will doubtless be fiercely debated. But the role of scientific knowledge in illuminating the past will be crucial. Just as we now no longer tolerate extinction, in the future we may no longer accept a mainland devoid of the biological wonders of our past such as tuatara. Conservation is thus not primarily about the past but about imagining and then creating the future we wish for our children and ourselves. For 80 million years until humans arrived, tuatara occurred throughout New Zealand—might they do so again?</p>"

      "bodyHtml": "<div class=\"group\" id=\"q27-28-29-30-31-anchor\"><h4>Questions 27-31</h4><p>Choose the correct letter, A, B, C or D.</p><a id=\"q27-anchor\"></a><div><p>27. What are we told about the Europeans who arrived in 1769?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"A\"> A. They thought there was only one large island.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"B\"> B. They had not come to study natural history.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"C\"> C. They had no interest in the tuatara.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q27\" value=\"D\"> D. They sent a tuatara to the British Museum.</label></div></div></div><a id=\"q28-anchor\"></a><div><p>28. What does the writer say about Albert Gunther in paragraph 3?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"A\"> A. He believed the tuatara could fetch a high price.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"B\"> B. He was typical of his generation of scientists.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"C\"> C. He disagreed with Charles Darwin's theory.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q28\" value=\"D\"> D. He wanted to stop the tuatara becoming extinct.</label></div></div></div><a id=\"q29-anchor\"></a><div><p>29. What did Albert Gunther think about the rats in New Zealand?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"A\"> A. They did not eat the tuatara.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"B\"> B. There was one species of rat.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"C\"> C. There had always been rats in New Zealand.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q29\" value=\"D\"> D. They were killed by Polynesians.</label></div></div></div><a id=\"q30-anchor\"></a><div><p>30. What did Ian Crook conclude from his research?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"A\"> A. Tuatara are safe on small islands.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"B\"> B. Ship's rats kill more tuatara than kiore.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"C\"> C. Kiore cannot swim to offshore islands.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q30\" value=\"D\"> D. Rats and tuatara cannot live together.</label></div></div></div><a id=\"q31-anchor\"></a><div><p>31. What were the findings of Richard Holdaway's research?</p><div class=\"mcq-options\"><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"A\"> A. Maori settled more recently than previously thought.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"B\"> B. The first Polynesian explorers formed permanent settlements.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"C\"> C. Ship's rats are the oldest rat species in the country.</label></div><div class=\"mcq-option\"><label><input type=\"radio\" name=\"q31\" value=\"D\"> D. Rats caused extinctions before any humans settled.</label></div></div></div></div>",

      "bodyHtml": "<div class=\"group\" id=\"q32-33-34-35-anchor\"><h4>Questions 32-35</h4><p>Do the following statements agree with the claims of the writer in Reading Passage 3?</p><div class=\"question-item\"><p><strong>32</strong> The available research supports Holdaway's theory but it has not been proved.</p><div class=\"radio-options\"><label><input name=\"q32\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q32\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q32\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>33</strong> Nowadays, it is possible to totally destroy a population of rats on a small island.</p><div class=\"radio-options\"><label><input name=\"q33\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q33\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q33\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>34</strong> Crook was the first person to recognize the potential of offshore islands as sanctuaries.</p><div class=\"radio-options\"><label><input name=\"q34\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q34\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q34\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div><div class=\"question-item\"><p><strong>35</strong> Tuatara numbers are continuing to fall.</p><div class=\"radio-options\"><label><input name=\"q35\" type=\"radio\" value=\"YES\"> YES</label><label><input name=\"q35\" type=\"radio\" value=\"NO\"> NO</label><label><input name=\"q35\" type=\"radio\" value=\"NOT GIVEN\"> NOT GIVEN</label></div></div></div>",

      "bodyHtml": "<div class=\"group\" id=\"q36-37-38-39-40-anchor\"><h4>Questions 36-40</h4><p>Complete the summary using the list of words, <strong>A-H</strong>, below.</p><h5>What conclusions can we draw?</h5><p>The most important result of the tuatara research is that it frees our <strong>36</strong> <span id=\"q36-target\" class=\"drop-target-summary\" data-question=\"q36\"></span>. Should we now go further and consider reintroducing <strong>37</strong> <span id=\"q37-target\" class=\"drop-target-summary\" data-question=\"q37\"></span> to our mainland rivers? For example, there are many similarities between rats and <strong>38</strong> <span id=\"q38-target\" class=\"drop-target-summary\" data-question=\"q38\"></span>. Perhaps our children will come to believe in the <strong>39</strong> <span id=\"q39-target\" class=\"drop-target-summary\" data-question=\"q39\"></span> of species, in the same way that our generation refuses to accept <strong>40</strong> <span id=\"q40-target\" class=\"drop-target-summary\" data-question=\"q40\"></span>.</p><div class=\"options-pool\"><strong>List of words</strong><div class=\"pool-items\"><div class=\"drag-item\" draggable=\"true\" data-option=\"A\">A natural evolution</div><div class=\"drag-item\" draggable=\"true\" data-option=\"B\">B imagination</div><div class=\"drag-item\" draggable=\"true\" data-option=\"C\">C indigenous plants</div><div class=\"drag-item\" draggable=\"true\" data-option=\"D\">D trout</div><div class=\"drag-item\" draggable=\"true\" data-option=\"E\">E pollution</div><div class=\"drag-item\" draggable=\"true\" data-option=\"F\">F possibility</div><div class=\"drag-item\" draggable=\"true\" data-option=\"G\">G native fish</div><div class=\"drag-item\" draggable=\"true\" data-option=\"H\">H extinction</div></div></div></div>",
