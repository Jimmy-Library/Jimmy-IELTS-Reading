<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 阅读练习</title>
    <link rel="stylesheet" href="../../../css/vocabulary-notebook.css">
    <link rel="stylesheet" href="../../../css/vocabulary-notebook-v2.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.__READING_ORIGINAL_UI__ = true;
        document.documentElement.removeAttribute('data-image-skin');
        document.documentElement.removeAttribute('data-theme');
    </script>
    <style>
        #image-skin-panel,
        #season-theme-panel,
        #skin-cursor-halo,
        #skin-cursor-dot,
        #skin-atmosphere-layer,
        #season-weather-canvas,
        #skin-atmosphere-canvas {
            display: none !important;
        }
        :root {
            --line: #d7dde5;
            --panel: #ffffff;
            --panel-alt: #edf2f9;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #2563eb;
            --success: #15803d;
            --danger: #b91c1c;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --practice-header-height: 67px;
            --practice-nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            padding-bottom: var(--practice-nav-height);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .header p {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #timer,
        .header-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 8px 12px;
            font-size: 0.92rem;
            color: var(--text);
        }

        .header-btn {
            cursor: pointer;
        }

        .shell {
            display: flex;
            height: calc(100vh - var(--practice-header-height) - var(--practice-nav-height));
            min-height: 0;
            width: 100%;
        }

        .pane {
            overflow: auto;
            background: var(--panel);
            padding: 22px;
        }

        #left {
            width: 50%;
            min-width: 320px;
        }

        #divider {
            flex: 0 0 8px;
            background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            cursor: ew-resize;
        }

        #right {
            flex: 1;
            min-width: 320px;
            background: var(--panel-alt);
            padding: 16px 20px;
        }

        #left p,
        #right p {
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .unified-group {
            margin-bottom: 18px;
        }

        .group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px 32px;
            margin-bottom: 24px;
        }

        .question-item,
        .match-question-item,
        .choice-item {
            margin-bottom: 12px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            min-height: 40px;
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            background: #eff6ff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .paragraph-dropzone.drag-over,
        .match-dropzone.drag-over {
            border-color: var(--accent);
            background: #dbeafe;
        }

        .paragraph-dropzone.dropzone-filled,
        .match-dropzone.dropzone-filled {
            border-style: solid;
        }

        .paragraph-label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .pool-items,
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .pool-items {
            min-height: 40px;
        }

        .pool-items.drag-over {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.08);
        }

        .dropped-items:empty::after {
            content: "拖到这里";
            font-size: 0.82rem;
            color: #7b8a98;
            letter-spacing: 0.02em;
        }

        .drag-item {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            padding: 6px 10px;
            cursor: grab;
            font-size: 0.9rem;
            user-select: none;
        }

        .drag-item.dragging {
            opacity: 0.55;
        }

        .drag-item--assigned {
            border-style: solid;
        }

        .drag-item[draggable="false"] {
            cursor: pointer;
            border-style: solid;
        }

        .practice-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
            z-index: 2000;
        }

        .practice-nav .title {
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .practice-nav .questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-item,
        .practice-nav .controls button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 6px 12px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
        }

        .q-item:hover,
        .practice-nav .controls button:hover {
            background: #f1f5f9;
        }

        .q-item.active {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        .q-item.answered {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .q-item.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: var(--success);
        }

        .q-item.incorrect {
            border-color: var(--danger);
            background: #fee2e2;
            color: var(--danger);
        }

        /* ---- 套题模式：一次展示全部小节题目（约 40 题）+ 跨篇跳转 ---- */
        .practice-nav .questions.question-nav--suite {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 16px;
            flex: 1 1 auto;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .q-passage {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-passage__label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.16);
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .q-passage__label--btn {
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .q-passage__label--btn:hover {
            background: rgba(37, 99, 235, 0.18);
            color: var(--accent);
        }

        .q-passage.is-current .q-passage__label {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent);
        }

        .q-passage__items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .question-nav--suite .q-item {
            padding: 3px 8px;
            font-size: 0.8rem;
            min-width: 30px;
            text-align: center;
        }

        .question-nav--suite .q-passage:not(.is-current) .q-item {
            opacity: 0.8;
        }

        .practice-nav .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ---- 导出 PDF：整页打印（文章 + 题目 + 作答 + 高亮 + 详情）---- */
        /* 套题合并打印：屏幕上不显示，仅打印时启用 */
        #suite-print-root {
            display: none;
        }

        .pdf-inline-note-comment {
            display: none;
        }

        body.suite-printing .pdf-inline-note-comment {
            display: inline;
            margin-left: 3px;
            color: #9a3412;
            font-size: 0.88em;
            font-weight: 700;
            font-style: italic;
        }

        @media print {
            html, body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 0 !important;
            }

            /* 套题导出：只打印三篇合并内容，隐藏只渲染单篇的实时页面 */
            body.suite-printing .shell,
            body.suite-printing .header,
            body.suite-printing #results,
            body.suite-printing #question-nav {
                display: none !important;
            }

            body.suite-printing #suite-print-root {
                display: block !important;
            }

            .pdf-inline-highlight {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-inline-note-comment {
                display: inline !important;
                margin-left: 3px;
                color: #9a3412 !important;
                font-size: 9pt;
                font-weight: 700;
                font-style: italic;
                white-space: normal;
            }

            #suite-print-root .suite-print__head h1 {
                font-size: 18pt;
                margin: 0 0 4px;
            }

            #suite-print-root .suite-print__head p {
                margin: 0 0 16px;
                font-weight: 700;
            }

            #suite-print-root .suite-print__passage {
                page-break-before: always;
                break-before: page;
            }

            #suite-print-root .suite-print__passage:first-of-type {
                page-break-before: auto;
                break-before: auto;
            }

            #suite-print-root .suite-print__title {
                font-size: 14pt;
                margin: 0 0 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #1f7a4d;
            }

            #suite-print-root .suite-print__tag {
                display: inline-block;
                margin-right: 8px;
                padding: 1px 8px;
                border-radius: 4px;
                background: #1f7a4d;
                color: #fff;
                font-size: 11pt;
            }

            #suite-print-root .suite-print__score {
                float: right;
                font-size: 12pt;
                color: #1f7a4d;
            }

            #suite-print-root .suite-print__article {
                margin-bottom: 14px;
                line-height: 1.7;
            }

            #suite-print-root .suite-print__answers {
                width: 100%;
                border-collapse: collapse;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #suite-print-root .suite-print__answers th,
            #suite-print-root .suite-print__answers td {
                border: 1px solid #cfd8dc;
                padding: 5px 8px;
                text-align: center;
                font-size: 10pt;
            }

            /* 完整题目区（与单篇导出一致：文章后接全部题目） */
            #suite-print-root .suite-print__questions {
                margin: 6px 0 16px;
                line-height: 1.6;
                font-size: 10.5pt;
            }

            #suite-print-root .suite-print__questions .unified-group,
            #suite-print-root .suite-print__questions .group {
                margin: 0 0 14px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__questions input[type="text"],
            #suite-print-root .suite-print__questions .blank {
                border: none;
                border-bottom: 1px solid #555;
                min-width: 90px;
                background: transparent;
            }

            #suite-print-root .suite-print__answerkey {
                margin-top: 12px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__ak-title {
                font-size: 12pt;
                margin: 0 0 6px;
                color: #1f7a4d;
            }

            /* 隐藏交互/悬浮元素（保留 header-controls 中的 timer 作为做题用时） */
            #settings-panel,
            #notes-panel,
            .overlay,
            #divider,
            #selbar,
            .practice-nav,
            .header-controls .header-btn {
                display: none !important;
            }

            /* 单篇导出 PDF：打印做题用时 */
            #timer::before {
                content: "做题用时：";
                font-weight: 700;
                color: #1f7a4d;
            }

            .header {
                position: static !important;
                box-shadow: none !important;
            }

            /* 双栏展开为整页单列，完整显示全部内容 */
            .shell {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            #left,
            #right {
                width: 100% !important;
                min-width: 0 !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
            }

            #right {
                margin-top: 18px;
            }

            /* 练习记录详情（结果区）始终展开 */
            #results {
                display: block !important;
            }

            .unified-group,
            .group,
            #results {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 保留高亮底色 */
            .hl {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .submit-btn {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            font-weight: 600;
        }

        #results {
            display: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin-top: 18px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: center;
        }

        .result-correct {
            color: var(--success);
            font-weight: 700;
        }

        .result-incorrect {
            color: var(--danger);
            font-weight: 700;
        }

        /* 套题结果：三篇分节呈现 */
        .suite-result-section__time {
            font-size: 0.82rem;
            color: #64748b;
            margin-right: 8px;
            white-space: nowrap;
        }
        .suite-result-duration {
            margin: 4px 0 14px;
            font-size: 0.86rem;
            color: #475569;
        }
        #timer[data-timer-overtime="1"] {
            color: #b91c1c;
            font-weight: 700;
        }
        .suite-result-total {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 6px 0 4px;
        }

        .suite-result-band {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
            font-size: 0.86rem;
        }

        .suite-result-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .suite-result-section__head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suite-result-section__tag {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
        }

        .suite-result-section__title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.92rem;
            opacity: 0.85;
        }

        .suite-result-section__score {
            flex: 0 0 auto;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        /* 提交后展示的微信 / 二维码联系卡片 */
        .contact-card {
            margin-top: 20px;
            padding: 18px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            background: var(--panel-alt, #f8fafc);
        }

        .contact-card .contact-title {
            margin: 0 0 12px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-card .contact-qr {
            display: block;
            width: 200px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .contact-card .contact-wechat {
            margin: 6px 0 4px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .contact-card .wechat-id-copy {
            display: inline-block;
            padding: 4px 12px;
            margin-left: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: #07c160;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        .contact-card .wechat-id-copy:hover {
            background: #06ad56;
        }

        .contact-card .wechat-id-copy.copied {
            background: #0369d9;
        }

        .contact-card .contact-hint {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--muted, #94a3b8);
        }

        body.dark-mode .contact-card {
            background: var(--panel-alt, #0f172a);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            z-index: 800;
        }

        #settings-panel,
        #notes-panel,
        #selbar {
            display: none;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                padding-bottom: calc(var(--practice-nav-height) + 16px);
            }

            .shell {
                display: block;
                height: auto;
            }

            #left,
            #right {
                width: 100%;
                min-width: 0;
            }

            #divider {
                display: none;
            }

            .practice-nav {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .practice-nav .controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ---------------- Phase 2 Aesthetics ---------------- */
        #timer {
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        #timer:hover {
            opacity: 0.85;
        }

        #timer.paused {
            opacity: 0.5;
        }

        #settings-btn {
            font-size: 1.1rem;
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ---------------- IELTS Aesthetic Tweaks ---------------- */
        /* Flattening corners */
        .group,
        .unified-group,
        #results {
            border-radius: 4px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            border-radius: 4px;
        }

        .drag-item {
            border-radius: 4px;
        }

        #timer,
        .header-btn,
        .q-item,
        .practice-nav .controls button {
            border-radius: 4px;
        }

        /* Font size utility classes */
        html.font-normal {
            font-size: 16px;
        }

        html.font-large {
            font-size: 18px;
        }

        html.font-xlarge {
            font-size: 20px;
        }

        /* Highlight visual */
        .hl {
            background-color: #72361c;
            color: #fff;
        }

        /* Note highlight */
        .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
            cursor: pointer;
        }

        .hl[data-hl-type="note"].note-anchor-active {
            background-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.35);
        }

        /* Pink highlight (second highlight pass) */
        .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        /* 回顾只读模式：隐藏选区工具条的高亮/删除按钮（仅保留 Note 查看） */
        body.review-readonly-mode #btnHL,
        body.review-readonly-mode #btnUH {
            display: none;
        }

        /* 回顾只读模式：计时器不可点击 */
        body.review-readonly-mode #timer {
            cursor: default;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --panel: #1e293b;
            --panel-alt: #0f172a;
            --text: #f8fafc;
            --line: #334155;
            background: #020617;
        }

        body.dark-mode .header {
            background: rgba(30, 41, 59, 0.94);
            border-bottom: 1px solid var(--line);
        }

        body.dark-mode .group,
        body.dark-mode .unified-group {
            background: var(--panel);
        }

        body.dark-mode .hl {
            background-color: #72361c;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        body.dark-mode .paragraph-dropzone,
        body.dark-mode .match-dropzone {
            background: #1e293b;
            border-color: #475569;
        }

        body.dark-mode .drag-item {
            background: #334155;
            border-color: #64748b;
            color: #f8fafc;
        }

        body.dark-mode #timer,

        "kind": "html",
        "html": "<h2>READING PASSAGE</h2>\n<h3>Motivating Employees under Adverse Conditions 逆境中激励员工</h3>\n<p>THE CHALLENGE</p>\n<p>It is a great deal easier to motivate employees in a growing organisation than a declining one. When organisations are expanding and adding personnel, promotional opportunities, pay rises, and the excitement of being associated with a dynamic organisation create feelings of optimism. Management is able to use the growth to entice and encourage employees. When an organisation is shrinking, the best and most mobile workers are prone to leave voluntarily. Unfortunately, they are the ones the organisation can least afford to lose - those with the highest skills and experience. The minor employees remain because their job options are limited.</p>\n<p>Morale also suffers during decline. People fear they may be the next to be made redundant. Productivity often suffers, as employees spend their time sharing rumours and providing one another with moral support rather than focusing on their jobs. For those whose jobs are secure, pay increases are rarely possible. Pay cuts, unheard of during times of growth, may even be imposed. The challenge to management is how to motivate employees under such retrenchment conditions. The ways of meeting this challenge can be broadly divided into six Key Points, which are outlined below.</p>\n<p><strong>A</strong> KEY POINT ONE</p>\n<p>There is an abundance of evidence to support the motivational benefits that result from carefully matching people to jobs. For example, if the job is running a small business or an autonomous unit within a larger business, high achievers should be sought. However, if the job to be filled is a managerial post in a large bureaucratic organisation, a candidate who has a high need for power and a low need for affiliation should be selected. Accordingly, high achievers should not be put into jobs that are inconsistent with their needs. High achievers will do best when the job provides moderately challenging goals and where there is independence and feedback. However, it should be remembered that not everybody is motivated by jobs that are high in independence, variety and responsibility.</p>\n<div class=\"paragraph-wrapper\" id=\"q1-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"B\" data-question=\"q1\">\n        <span class=\"paragraph-label\">Key Point Two (Q1):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n</div>\n<p>The literature on goal-setting theory suggests that managers should ensure that all employees have specific goals and receive comments on how well they are doing in those goals. For those with high achievement needs, typically a minority in any organisation, the existence of external goals is less important because high achievers are already internally motivated. The next factor to be determined is whether the goals should be assigned by a manager or collectively set in conjunction with the employees. The answer to that depends on perceptions of goal acceptance and the organisation's culture. If resistance to goals is expected, the use of participation in goal-setting should increase acceptance. If participation is inconsistent with the culture, however, goals should be assigned. If participation and the culture are incongruous, employees are likely to perceive the participation process as manipulative and be negatively affected by it.</p>\n<div class=\"paragraph-wrapper\" id=\"q2-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"C\" data-question=\"q2\">\n        <span class=\"paragraph-label\">Key Point Three (Q2):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n</div>\n<p>Regardless of whether goals are achievable or well within management's perceptions of the employee's ability, if employees see them as unachievable they will reduce their effort. Managers must be sure, therefore, that employees feel confident that their efforts can lead to performance goals. For managers, this means that employees must have the capability of doing the job and must regard the appraisal process as valid.</p>\n<div class=\"paragraph-wrapper\" id=\"q3-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"D\" data-question=\"q3\">\n        <span class=\"paragraph-label\">Key Point Four (Q3):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n</div>\n<p>Since employees have different needs, what acts as a reinforcement for one may not for another. Managers could use their knowledge of each employee to personalise the rewards over which they have control. Some of the more obvious rewards that managers allocate include pay, promotions, autonomy, job scope and depth, and the opportunity to participate in goal-setting and decision-making.</p>\n<div class=\"paragraph-wrapper\" id=\"q4-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"E\" data-question=\"q4\">\n        <span class=\"paragraph-label\">Key Point Five (Q4):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n</div>\n<p>Managers need to make rewards contingent on performance. To reward factors other than performance will only reinforce those other factors. Key rewards such as pay increases and promotions or advancements should be allocated for the attainment of the employee's specific goals. Consistent with maximising the impact of rewards, managers should look for ways to increase their visibility. Eliminating the secrecy surrounding pay by openly communicating everyone's remuneration, publicising performance bonuses and allocating annual salary increases in a lump sum rather than spreading them out over an entire year are examples of actions that will make rewards more visible and potentially more motivating.</p>\n<div class=\"paragraph-wrapper\" id=\"q5-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"F\" data-question=\"q5\">\n        <span class=\"paragraph-label\">Key Point Six (Q5):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n</div>\n<p>The way rewards are distributed should be transparent so that employees perceive that rewards or outcomes are equitable and equal to the inputs given. On a simplistic level, experience, abilities, effort and other obvious inputs should explain differences in pay, responsibility and other obvious outcomes. The problem, however, is complicated by the existence of dozens of inputs and outcomes and by the fact that employee groups place different degrees of importance on them. For instance, a study comparing clerical and production workers identified nearly twenty inputs and outcomes. The clerical workers considered factors such as quality of work performed and job knowledge near the top of their list, but these were at the bottom of the production workers' list. Similarly, production workers thought that the most important inputs were intelligence and personal involvement with task accomplishment, two factors that were quite low in the importance ratings of the clerks. There were also important, though less dramatic, differences on the outcome side. For example, production workers rated advancement very highly, whereas clerical workers rated advancement in the lower third of their list. Such findings suggest that one person's equity is another's inequity, so an ideal should probably weigh different inputs and outcomes according to employee group.</p>"
