<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 阅读练习</title>
    <link rel="stylesheet" href="../../../css/vocabulary-notebook.css">
    <link rel="stylesheet" href="../../../css/vocabulary-notebook-v2.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.__READING_ORIGINAL_UI__ = true;
        document.documentElement.removeAttribute('data-image-skin');
        document.documentElement.removeAttribute('data-theme');
    </script>
    <style>
        #image-skin-panel,
        #season-theme-panel,
        #skin-cursor-halo,
        #skin-cursor-dot,
        #skin-atmosphere-layer,
        #season-weather-canvas,
        #skin-atmosphere-canvas {
            display: none !important;
        }
        :root {
            --line: #d7dde5;
            --panel: #ffffff;
            --panel-alt: #edf2f9;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #2563eb;
            --success: #15803d;
            --danger: #b91c1c;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --practice-header-height: 67px;
            --practice-nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            padding-bottom: var(--practice-nav-height);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .header p {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #timer,
        .header-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 8px 12px;
            font-size: 0.92rem;
            color: var(--text);
        }

        .header-btn {
            cursor: pointer;
        }

        .shell {
            display: flex;
            height: calc(100vh - var(--practice-header-height) - var(--practice-nav-height));
            min-height: 0;
            width: 100%;
        }

        .pane {
            overflow: auto;
            background: var(--panel);
            padding: 22px;
        }

        #left {
            width: 50%;
            min-width: 320px;
        }

        #divider {
            flex: 0 0 8px;
            background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            cursor: ew-resize;
        }

        #right {
            flex: 1;
            min-width: 320px;
            background: var(--panel-alt);
            padding: 16px 20px;
        }

        #left p,
        #right p {
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .unified-group {
            margin-bottom: 18px;
        }

        .group {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px 32px;
            margin-bottom: 24px;
        }

        .question-item,
        .match-question-item,
        .choice-item {
            margin-bottom: 12px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            min-height: 40px;
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            background: #eff6ff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .paragraph-dropzone.drag-over,
        .match-dropzone.drag-over {
            border-color: var(--accent);
            background: #dbeafe;
        }

        .paragraph-dropzone.dropzone-filled,
        .match-dropzone.dropzone-filled {
            border-style: solid;
        }

        .paragraph-label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .pool-items,
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .pool-items {
            min-height: 40px;
        }

        .pool-items.drag-over {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.08);
        }

        .dropped-items:empty::after {
            content: "拖到这里";
            font-size: 0.82rem;
            color: #7b8a98;
            letter-spacing: 0.02em;
        }

        .drag-item {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            padding: 6px 10px;
            cursor: grab;
            font-size: 0.9rem;
            user-select: none;
        }

        .drag-item.dragging {
            opacity: 0.55;
        }

        .drag-item--assigned {
            border-style: solid;
        }

        .drag-item[draggable="false"] {
            cursor: pointer;
            border-style: solid;
        }

        .practice-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid var(--line);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
            z-index: 2000;
        }

        .practice-nav .title {
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }

        .practice-nav .questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-item,
        .practice-nav .controls button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 6px 12px;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
        }

        .q-item:hover,
        .practice-nav .controls button:hover {
            background: #f1f5f9;
        }

        .q-item.active {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
            font-weight: 600;
        }

        .q-item.answered {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .q-item.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: var(--success);
        }

        .q-item.incorrect {
            border-color: var(--danger);
            background: #fee2e2;
            color: var(--danger);
        }

        /* ---- 套题模式：一次展示全部小节题目（约 40 题）+ 跨篇跳转 ---- */
        .practice-nav .questions.question-nav--suite {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 16px;
            flex: 1 1 auto;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .q-passage {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-passage__label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.16);
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .q-passage__label--btn {
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .q-passage__label--btn:hover {
            background: rgba(37, 99, 235, 0.18);
            color: var(--accent);
        }

        .q-passage.is-current .q-passage__label {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent);
        }

        .q-passage__items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .question-nav--suite .q-item {
            padding: 3px 8px;
            font-size: 0.8rem;
            min-width: 30px;
            text-align: center;
        }

        .question-nav--suite .q-passage:not(.is-current) .q-item {
            opacity: 0.8;
        }

        .practice-nav .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ---- 导出 PDF：整页打印（文章 + 题目 + 作答 + 高亮 + 详情）---- */
        /* 套题合并打印：屏幕上不显示，仅打印时启用 */
        #suite-print-root {
            display: none;
        }

        .pdf-inline-note-comment {
            display: none;
        }

        body.suite-printing .pdf-inline-note-comment {
            display: inline;
            margin-left: 3px;
            color: #9a3412;
            font-size: 0.88em;
            font-weight: 700;
            font-style: italic;
        }

        @media print {
            html, body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
                padding-bottom: 0 !important;
            }

            /* 套题导出：只打印三篇合并内容，隐藏只渲染单篇的实时页面 */
            body.suite-printing .shell,
            body.suite-printing .header,
            body.suite-printing #results,
            body.suite-printing #question-nav {
                display: none !important;
            }

            body.suite-printing #suite-print-root {
                display: block !important;
            }

            .pdf-inline-highlight {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .pdf-inline-note-comment {
                display: inline !important;
                margin-left: 3px;
                color: #9a3412 !important;
                font-size: 9pt;
                font-weight: 700;
                font-style: italic;
                white-space: normal;
            }

            #suite-print-root .suite-print__head h1 {
                font-size: 18pt;
                margin: 0 0 4px;
            }

            #suite-print-root .suite-print__head p {
                margin: 0 0 16px;
                font-weight: 700;
            }

            #suite-print-root .suite-print__passage {
                page-break-before: always;
                break-before: page;
            }

            #suite-print-root .suite-print__passage:first-of-type {
                page-break-before: auto;
                break-before: auto;
            }

            #suite-print-root .suite-print__title {
                font-size: 14pt;
                margin: 0 0 10px;
                padding-bottom: 6px;
                border-bottom: 2px solid #1f7a4d;
            }

            #suite-print-root .suite-print__tag {
                display: inline-block;
                margin-right: 8px;
                padding: 1px 8px;
                border-radius: 4px;
                background: #1f7a4d;
                color: #fff;
                font-size: 11pt;
            }

            #suite-print-root .suite-print__score {
                float: right;
                font-size: 12pt;
                color: #1f7a4d;
            }

            #suite-print-root .suite-print__article {
                margin-bottom: 14px;
                line-height: 1.7;
            }

            #suite-print-root .suite-print__answers {
                width: 100%;
                border-collapse: collapse;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #suite-print-root .suite-print__answers th,
            #suite-print-root .suite-print__answers td {
                border: 1px solid #cfd8dc;
                padding: 5px 8px;
                text-align: center;
                font-size: 10pt;
            }

            /* 完整题目区（与单篇导出一致：文章后接全部题目） */
            #suite-print-root .suite-print__questions {
                margin: 6px 0 16px;
                line-height: 1.6;
                font-size: 10.5pt;
            }

            #suite-print-root .suite-print__questions .unified-group,
            #suite-print-root .suite-print__questions .group {
                margin: 0 0 14px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__questions input[type="text"],
            #suite-print-root .suite-print__questions .blank {
                border: none;
                border-bottom: 1px solid #555;
                min-width: 90px;
                background: transparent;
            }

            #suite-print-root .suite-print__answerkey {
                margin-top: 12px;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            #suite-print-root .suite-print__ak-title {
                font-size: 12pt;
                margin: 0 0 6px;
                color: #1f7a4d;
            }

            /* 隐藏交互/悬浮元素（保留 header-controls 中的 timer 作为做题用时） */
            #settings-panel,
            #notes-panel,
            .overlay,
            #divider,
            #selbar,
            .practice-nav,
            .header-controls .header-btn {
                display: none !important;
            }

            /* 单篇导出 PDF：打印做题用时 */
            #timer::before {
                content: "做题用时：";
                font-weight: 700;
                color: #1f7a4d;
            }

            .header {
                position: static !important;
                box-shadow: none !important;
            }

            /* 双栏展开为整页单列，完整显示全部内容 */
            .shell {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            #left,
            #right {
                width: 100% !important;
                min-width: 0 !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                display: block !important;
                padding: 0 !important;
            }

            #right {
                margin-top: 18px;
            }

            /* 练习记录详情（结果区）始终展开 */
            #results {
                display: block !important;
            }

            .unified-group,
            .group,
            #results {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 保留高亮底色 */
            .hl {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .submit-btn {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            font-weight: 600;
        }

        #results {
            display: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin-top: 18px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: center;
        }

        .result-correct {
            color: var(--success);
            font-weight: 700;
        }

        .result-incorrect {
            color: var(--danger);
            font-weight: 700;
        }

        /* 套题结果：三篇分节呈现 */
        .suite-result-total {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 6px 0 4px;
        }

        .suite-result-band {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
            font-size: 0.86rem;
        }

        .suite-result-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .suite-result-section__head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .suite-result-section__tag {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.12);
            color: #1d4ed8;
        }

        .suite-result-section__title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.92rem;
            opacity: 0.85;
        }

        .suite-result-section__score {
            flex: 0 0 auto;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        /* 提交后展示的微信 / 二维码联系卡片 */
        .contact-card {
            margin-top: 20px;
            padding: 18px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
            background: var(--panel-alt, #f8fafc);
        }

        .contact-card .contact-title {
            margin: 0 0 12px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
        }

        .contact-card .contact-qr {
            display: block;
            width: 200px;
            max-width: 70%;
            height: auto;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .contact-card .contact-wechat {
            margin: 6px 0 4px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .contact-card .wechat-id-copy {
            display: inline-block;
            padding: 4px 12px;
            margin-left: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: #07c160;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease;
        }

        .contact-card .wechat-id-copy:hover {
            background: #06ad56;
        }

        .contact-card .wechat-id-copy.copied {
            background: #0369d9;
        }

        .contact-card .contact-hint {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--muted, #94a3b8);
        }

        body.dark-mode .contact-card {
            background: var(--panel-alt, #0f172a);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            z-index: 800;
        }

        #settings-panel,
        #notes-panel,
        #selbar {
            display: none;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
                padding-bottom: calc(var(--practice-nav-height) + 16px);
            }

            .shell {
                display: block;
                height: auto;
            }

            #left,
            #right {
                width: 100%;
                min-width: 0;
            }

            #divider {
                display: none;
            }

            .practice-nav {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .practice-nav .controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ---------------- Phase 2 Aesthetics ---------------- */
        #timer {
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        #timer:hover {
            opacity: 0.85;
        }

        #timer.paused {
            opacity: 0.5;
        }

        #settings-btn {
            font-size: 1.1rem;
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ---------------- IELTS Aesthetic Tweaks ---------------- */
        /* Flattening corners */
        .group,
        .unified-group,
        #results {
            border-radius: 4px;
        }

        .paragraph-dropzone,
        .match-dropzone {
            border-radius: 4px;
        }

        .drag-item {
            border-radius: 4px;
        }

        #timer,
        .header-btn,
        .q-item,
        .practice-nav .controls button {
            border-radius: 4px;
        }

        /* Font size utility classes */
        html.font-normal {
            font-size: 16px;
        }

        html.font-large {
            font-size: 18px;
        }

        html.font-xlarge {
            font-size: 20px;
        }

        /* Highlight visual */
        .hl {
            background-color: #72361c;
            color: #fff;
        }

        /* Note highlight */
        .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
            cursor: pointer;
        }

        .hl[data-hl-type="note"].note-anchor-active {
            background-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.35);
        }

        /* Pink highlight (second highlight pass) */
        .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        /* 回顾只读模式：隐藏选区工具条的高亮/删除按钮（仅保留 Note 查看） */
        body.review-readonly-mode #btnHL,
        body.review-readonly-mode #btnUH {
            display: none;
        }

        /* 回顾只读模式：计时器不可点击 */
        body.review-readonly-mode #timer {
            cursor: default;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --panel: #1e293b;
            --panel-alt: #0f172a;
            --text: #f8fafc;
            --line: #334155;
            background: #020617;
        }

        body.dark-mode .header {
            background: rgba(30, 41, 59, 0.94);
            border-bottom: 1px solid var(--line);
        }

        body.dark-mode .group,
        body.dark-mode .unified-group {
            background: var(--panel);
        }

        body.dark-mode .hl {
            background-color: #72361c;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="note"] {
            background-color: #0369d9;
            color: #fff;
        }

        body.dark-mode .hl[data-hl-type="pink"] {
            background-color: #ec4899;
            color: #fff;
        }

        body.dark-mode .paragraph-dropzone,
        body.dark-mode .match-dropzone {
            background: #1e293b;
            border-color: #475569;
        }

        body.dark-mode .drag-item {
            background: #334155;
            border-color: #64748b;
            color: #f8fafc;
        }

        body.dark-mode #timer,
        body.dark-mode .header-btn {
            background: var(--panel);
            color: #f8fafc;
        }

        /* Phase 3 Nav Dark Mode */
        body.dark-mode .practice-nav {
            background: var(--panel);
            border-color: var(--line);
        }

        body.dark-mode .q-item,
        body.dark-mode .practice-nav .controls button {
            background: var(--panel-alt);
            color: #f8fafc;
            border-color: var(--line);

      {
        "blockId": "passage-main",
        "kind": "html",
        "html": "<h2>READING PASSAGE</h2>\n<h3>Loss of Rare Languages 稀有语言的消亡</h3>\n<p>\"Obviously we must do some serious rethinking of our priorities, lest linguistics go down in history as the only science that presided obviously over the disappearance of 90 percent of the very field to which it is dedicated.\" - Michael Krauss, The World's languages in Crisis\"</p>\n<div class=\"paragraph-wrapper\" id=\"q27-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"A\" data-question=\"q27\">\n        <span class=\"paragraph-label\">Paragraph A (Q27):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>A</strong> Ten years ago, Michael Krauss sent a shudder through the discipline of linguistics with his prediction that half the 6,000 or so languages spoken in the world would cease to be uttered within a century. Unless scientists and community leaders directed a worldwide effort to stabilize the decline of local languages, he warned, nine tenths of the linguistic diversity of humankind would probably be doomed to extinction. Krauss's prediction was little more than an educated guess, but other respected linguists had been clanging out similar alarms. Keneth L. Hale of the Massachusetts Institute of Technology noted in the same journal issue that eight languages on which he had done fieldwork had since passed into extinction. A 1990 survey in Australia found that 70 of the 90 surviving Aboriginal languages were no longer used regularly by all age groups. The same was true for all but 20 of the 175 Native American languages spoken or remembered in the US, Krauss told a congressional panel in 1992.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q28-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"B\" data-question=\"q28\">\n        <span class=\"paragraph-label\">Paragraph B (Q28):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>B</strong> Many experts in the field mourn the loss of rare languages, for several reasons. To start, there is scientific self-interest; some of the most basic questions in linguistics have to do with the limits of human speech, which are far from fully explored. Many researchers would like to know which structural elements of grammar and vocabulary—If any—are truly universal and probably therefore hardwired into the human brain. Other scientists try to reconstruct ancient migration patterns by comparing borrowed words that appear in otherwise unrelated languages, in each of these cases, the wider the portfolio of languages you study, the more likely you are to get the right answers.</p>\n</div>\n<p><strong>C</strong> Despite the near constant buzz in linguistics about endangered languages over the past 10 years, the field has accomplished depressingly little. \"You would think that there would be some organized response to this dire situation 'some attempt to determine which language can be saved and which should be documented before they disappear, says Sarah G Thomason, a linguist at the University of Michigan at Ann Arbor. But there isn't any such effort organized in the profession. It is only recently that it has become fashionable enough to work on endangered languages.\" Six years ago, recalls Douglas H. Whalen of Yale University, when I asked linguists who was raising money to deal with these problems, I mostly got blank stares.\" So, Whalen and a few other linguists founded the Endangered Languages Fund. In the five years to 2001 they were able to collect only $80,000 for research grants. A similar foundation in England, directed by Nicholas Ostler, has raised just $8,000 since 1995.</p>\n<div class=\"paragraph-wrapper\" id=\"q29-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"D\" data-question=\"q29\">\n        <span class=\"paragraph-label\">Paragraph D (Q29):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>D</strong> But there are encouraging signs that the field has turned a corner. The Volkswagen Foundation, a German charity, just issued its second round of grants totaling more than $2 million. It has created a multimedia archive at the Max Planck Institute for Psycholinguistics in the Netherlands that can house recordings, grammars, dictionaries and other data on endangered languages. To fill the archive, the foundation has dispatched field linguists to document Aweti (100 or so speakers in Brazil), Ega (about 300 speakers in Ivory Coast). Waima'a (a few hundred speakers in East Timor), and a dozen or so other languages unlikely to survive the century. The Ford Foundation has also edged into the arena. Its contributions helped to reinvigorate a master-apprentice program created in 1992 by Leanne Hinton of Berkeley and Native Americans worried about the imminent demise of about 50 indigenous languages in California. Fluent speakers receive $3,000 to teach a younger relative (who is also paid) their native tongue through 360 hours of shared activities, spread over six months. So far about 5 teams have completed the program, Hinton says, transmitting at least some knowledge of 25 languages. \"It's too early to call this language revitalization,\" Hinton admits. \"In California the death rate of elderly speakers will always be greater than the recruitment rate of young speakers. But at least we prolong the survival of the language.\" That will give linguists more time to record these tongues before they vanish.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q30-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"E\" data-question=\"q30\">\n        <span class=\"paragraph-label\">Paragraph E (Q30):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>E</strong> But the master-apprentice approach hasn't caught on outside the U.S., and Hinton's effort is a drop in the sea. At least 440 languages have been reduced to a mere handful of elders, according to the Ethnologue, a catalogue of languages produced by the Dallas-based group SIL International that comes closest to global coverage. For the vast majority of these languages, there is little or no record of their grammar, vocabulary, pronunciation or use in daily life. Even if a language has been fully documented, all that remains once it vanishes from active use is a fossil skeleton, a scattering of features that the scientist was lucky and astute enough to capture. linguists may be able to sketch an outline of the forgotten language and fix its place on the evolutionary tree, but little more. \"How did people start conversations and talk to babies? How did husbands and wives converse?\" Hinton asks. \"Those are the first things you want to learn when you want to revitalize the language.\"</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q31-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"F\" data-question=\"q31\">\n        <span class=\"paragraph-label\">Paragraph F (Q31):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>F</strong> But there Is as yet no discipline of \"conservation linguistics,\" as there is for biology. Almost every strategy tried so far has succeeded in some places but failed in others, and there seems to be no way to predict with certainty what will work where. Twenty years ago in New Zealand, Maori speakers set up \"language nests,\" in which preschoolers were immersed in the native language. Additional Maori-only classes were added as the children progressed through elementary and secondary school. A similar approach was tried in Hawaii, with some success—the number of native speakers has stabilized at 1,000 or so, reports Joseph E. Grimes of SIL International, who Is working on Oahu. Students can now get instruction in Hawaiian all the way through university.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q32-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"G\" data-question=\"q32\">\n        <span class=\"paragraph-label\">Paragraph G (Q32):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>G</strong> One factor that always seems to occur in the demise of a language is that the speakers begin to have collective doubts about the usefulness of language loyalty. Once they start regarding their own language as inferior to the majority language, people stop using it for all situations. Kids pick up on the attitude and prefer the dominant language. In many cases, people don't notice until they suddenly realize that their kids never speak the language, even at home. This is how Cornish, and some dialects of Scottish Gaelic is still only rarely used for daily home life in Ireland, 80 years after the republic was founded with Irish as its first official language.</p>\n</div>\n<div class=\"paragraph-wrapper\" id=\"q33-anchor\">\n    <div class=\"paragraph-dropzone dropzone\" data-paragraph=\"H\" data-question=\"q33\">\n        <span class=\"paragraph-label\">Paragraph H (Q33):</span>\n        <div class=\"dropped-items\"></div>\n    </div>\n    <p><strong>H</strong> Linguists agree that ultimately, the answer to the problem of language extinction is multilingualism. Even uneducated people can learn several languages, as long as they start as children. Indeed, most people in the world speak more than one tongue, and in places such as Cameroon (279 languages), Papua New Guinea (823) and India (387) it is common to speak three or four distinct languages and a dialect or two as well. Most Americans and Canadians, to the west of Quebec, have a gut reaction that anyone speaking another language in front of them is committing an immoral act. You get the same reaction in Australia and Russia. It is no coincidence that these are the areas where languages are disappearing the fastest. The first step in saving dying languages is to persuade the world's majorities to allow the minorities among them to speak with their own voices.</p>\n</div>"
      }
    ]

      "bodyHtml": "<div class=\"group\" id=\"q34-35-36-37-38-anchor\"><h4>Questions 34-38</h4><p>Look at the following statements (Questions 34-38) and the list of items below.</p><p>Match each statement with the correct option, A-F.</p><p>Write the correct letter, A-F, in boxes 34-38 on your answer sheet.</p><div class=\"match-question-item\" id=\"q34-anchor\"><p><strong>34</strong> Reported about the success of a language conservation practice in Hawaii</p><div class=\"match-dropzone\" data-question=\"q34\"></div></div><div class=\"match-question-item\" id=\"q35-anchor\"><p><strong>35</strong> Predicted that many languages would disappear soon</p><div class=\"match-dropzone\" data-question=\"q35\"></div></div><div class=\"match-question-item\" id=\"q36-anchor\"><p><strong>36</strong> Experienced loss of languages he had worked on personally</p><div class=\"match-dropzone\" data-question=\"q36\"></div></div><div class=\"match-question-item\" id=\"q37-anchor\"><p><strong>37</strong> Raised language funds in England</p><div class=\"match-dropzone\" data-question=\"q37\"></div></div><div class=\"match-question-item\" id=\"q38-anchor\"><p><strong>38</strong> Not enough effort on saving languages until recent work</p><div class=\"match-dropzone\" data-question=\"q38\"></div></div><div class=\"options-pool\" data-allow-reuse=\"true\" data-allow-option-reuse=\"true\"><div class=\"pool-items\"><div class=\"drag-item\" draggable=\"true\" data-option=\"A\">A Nicholas Ostler</div><div class=\"drag-item\" draggable=\"true\" data-option=\"B\">B Michael Krauss</div><div class=\"drag-item\" draggable=\"true\" data-option=\"C\">C Joseph E. Grimes</div><div class=\"drag-item\" draggable=\"true\" data-option=\"D\">D Sarah G. Thomason</div><div class=\"drag-item\" draggable=\"true\" data-option=\"E\">E Keneth L. Hale</div><div class=\"drag-item\" draggable=\"true\" data-option=\"F\">F Douglas H. Whalen</div></div></div></div>",
